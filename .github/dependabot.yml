version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      typescript-tooling:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'tsx'
          - 'vitest'
          - '@vitest/*'
      next-core:
        patterns:
          - 'next'
          - 'eslint-config-next'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/client'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
