name: Security

# Dependency-vulnerability gate. CodeQL (codeql.yml) covers static analysis;
# this catches known-vulnerable dependencies in the lockfile so merges can't
# ship them. Weekly re-scan catches advisories published after the merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high
