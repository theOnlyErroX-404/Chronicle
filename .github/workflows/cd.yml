name: CD

# Builds the Next.js standalone image and pushes it to GHCR. Deployment to a
# specific host is intentionally out of scope until one exists; consuming the
# image (docker run / docker compose pull) is covered in 2-G.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate the shipped image: fail the pipeline on fixable HIGH/CRITICAL
      # vulnerabilities in the runtime image (OS packages + bundled npm deps).
      # Unfixed advisories are ignored so the base image's known CVE backlog
      # doesn't red the pipeline forever.
      - name: Compute lowercase image ref
        id: image
        run: |
          # Trivy's image parser rejects uppercase in the repo path (the repo
          # name is mixed-case); GHCR resolves the lowercase form.
          IMG="${REGISTRY,,}/${IMAGE_NAME,,}:main"
          echo "ref=$IMG" >> "$GITHUB_OUTPUT"
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
